<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-column storage and play order</title>
  <desc id="desc">Store Exit first and Guard second, from bottom to top. The exposed Guard is played first. After defeating it, use the exposed Exit. Empty columns remain empty.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#536c67"/></marker></defs>
  <rect width="960" height="540" rx="24" fill="#f6f3ea"/>
  <g font-family="Arial, sans-serif" fill="#253d38">
    <text x="40" y="55" font-size="28" font-weight="700">Fixed columns: store bottom → top, play top first</text>
    <text x="40" y="85" font-size="17">The last card in cards is exposed. The random pool does not fill fixed columns.</text>
    <rect x="40" y="115" width="280" height="310" rx="16" fill="#e6eee5"/>
    <text x="60" y="150" font-size="21" font-weight="700">1 · Store the column</text>
    <rect x="70" y="177" width="220" height="80" rx="10" fill="#dce6f0" stroke="#627b99" stroke-width="2"/>
    <text x="91" y="213" font-size="21" font-weight="700">Guard · cards[1]</text>
    <text x="91" y="240" font-size="16">TOP · exposed</text>
    <rect x="70" y="285" width="220" height="80" rx="10" fill="#f1e1b6" stroke="#9e8746" stroke-width="2"/>
    <text x="91" y="321" font-size="21" font-weight="700">Exit · cards[0]</text>
    <text x="91" y="348" font-size="16">BOTTOM · covered</text>
    <text x="60" y="398" font-size="16">Add Exit, then add Guard.</text>
    <path d="M329 267H371" stroke="#536c67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="385" y="115" width="250" height="310" rx="16" fill="#e6eee5"/>
    <text x="405" y="150" font-size="21" font-weight="700">2 · Defeat the guard</text>
    <rect x="413" y="201" width="195" height="115" rx="10" fill="#dce6f0" stroke="#627b99" stroke-width="2"/>
    <text x="442" y="247" font-size="23" font-weight="700">Guard</text>
    <text x="442" y="279" font-size="17">Attack this card.</text>
    <text x="405" y="368" font-size="16">The removed guard reveals</text>
    <text x="405" y="393" font-size="16">the card underneath.</text>
    <path d="M644 267H686" stroke="#536c67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="700" y="115" width="220" height="310" rx="16" fill="#e6eee5"/>
    <text x="720" y="150" font-size="21" font-weight="700">3 · Use the exit</text>
    <rect x="728" y="201" width="164" height="115" rx="10" fill="#f1e1b6" stroke="#9e8746" stroke-width="2"/>
    <text x="757" y="247" font-size="23" font-weight="700">Exit</text>
    <text x="757" y="279" font-size="17">Now exposed.</text>
    <text x="720" y="368" font-size="16">Click it to leave.</text>
    <text x="720" y="393" font-size="16">Check the result.</text>
    <text x="40" y="477" font-size="18" font-weight="700">Optional reward lesson: add the Encounter last, above the Guard.</text>
    <text x="40" y="506" font-size="17">Then play Encounter → Guard → Exit. Keep the other columns empty.</text>
  </g>
</svg>
