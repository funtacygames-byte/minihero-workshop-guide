<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">Export a single icon</title><desc id="desc">A contact sheet contains six symbols. Export only the intended symbol as one square file, with a small margin. The whole sheet is not a single treasure icon. This is a neutral illustration, not a screenshot.</desc>
