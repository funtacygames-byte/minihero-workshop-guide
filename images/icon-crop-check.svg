<rect width="1080" height="520" rx="18" fill="#f7f3e9"/>
<g font-family="sans-serif" font-size="25" fill="#31443c"><text x="44" y="49">Contact sheet: six images</text><text x="660" y="49">Export: one icon</text></g>
<rect x="45" y="92" width="444" height="296" fill="#e5edde" stroke="#8c9c87" stroke-width="2"/>
<g stroke="#a0ae9b" stroke-width="1"><path d="M193 92v296M341 92v296M45 240h444"/></g>
<g fill="#a8bba1" stroke="#59715e" stroke-width="2"><circle cx="119" cy="166" r="30"/><rect x="384" y="133" width="64" height="64" rx="12"/><path d="M89 341l30-60 30 60zM386 314h60M416 284v60"/><circle cx="267" cy="314" r="32" fill="none"/></g>
<use href="#gem" transform="translate(267 166)"/>
<rect x="199" y="98" width="136" height="136" fill="none" stroke="#397253" stroke-width="4" stroke-dasharray="8 5"/>
<path d="M510 166H614M601 155l14 11-14 11" stroke="#59715e" stroke-width="4" fill="none"/>
<rect x="660" y="92" width="252" height="252" fill="#e5edde" stroke="#59715e" stroke-width="3"/>
<rect x="680" y="112" width="212" height="212" fill="none" stroke="#8c9c87" stroke-width="2" stroke-dasharray="6 5"/>
<use href="#gem" transform="translate(786 218) scale(2.3)"/>
<g font-family="sans-serif" font-size="20" fill="#685c49"><text x="45" y="429">Wrong input: the whole sheet</text><text x="660" y="386">1:1 file, one subject, clear margin</text><text x="45" y="468">Inspect the actual game slot after building.</text><text x="45" y="500">Neutral illustration; it does not simulate the renderer.</text></g>
