<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="560" viewBox="0 0 1220 560" role="img" aria-labelledby="title desc">
<title id="title">Character artwork: two compositions with complete backgrounds</title>
<desc id="desc">Both character images have complete opaque scene backgrounds. Icon: 71 to 128 tall art in a 284 by 512 display frame, with larger equivalent sources allowed. Avatar: 4 to 5 portrait, such as 1024 by 1280; small selection avatars use its top square. Enemy BattleArt stays square. StageBackground is landscape.</desc>

