<rect x="585" y="152" width="180" height="180" rx="3" fill="#d9e4d1" stroke="#59715e" stroke-width="2"/>
<path d="M628 272l-6-77 33 23 46-6 22-22-4 77-44 27z" fill="#78927c"/><circle cx="655" cy="247" r="5" fill="#31443c"/><circle cx="697" cy="247" r="5" fill="#31443c"/>
