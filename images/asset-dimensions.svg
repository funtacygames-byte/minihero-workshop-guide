<g font-family="sans-serif" text-anchor="middle" fill="#31443c" font-size="22"><text x="131" y="65">Character Icon</text><text x="402" y="65">Character Avatar</text><text x="675" y="65">Enemy BattleArt</text><text x="1000" y="65">StageBackground</text></g>
<rect x="60" y="110" width="142" height="256" rx="3" fill="#b9d1be" stroke="#59715e" stroke-width="2"/>
<path d="M61 270l40-95 35 65 28-50 37 75v100H61z" fill="#93af99"/>
<g fill="#6c9075"><circle cx="131" cy="160" r="23"/><path d="M110 190h42l16 99H94z"/><rect x="109" y="289" width="15" height="48"/><rect x="139" y="289" width="15" height="48"/></g>
<rect x="310" y="125" width="184" height="230" fill="#b9d1be" stroke="#59715e" stroke-width="2"/>
<path d="M311 245l46-77 46 77 40-62 50 67v104H311z" fill="#819f88"/><circle cx="402" cy="187" r="32" fill="#f0d0a0"/><path d="M350 331q0-105 52-105t52 105v23H350z" fill="#476a54"/>
<rect x="310" y="125" width="184" height="184" fill="none" stroke="#b56a48" stroke-width="3" stroke-dasharray="8 5"/>
