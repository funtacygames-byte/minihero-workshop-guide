<g font-family="sans-serif" text-anchor="middle" fill="#685c49" font-size="19"><text x="131" y="410">568 × 1024 · 71:128</text><text x="131" y="442">full opaque background</text><text x="402" y="410">1024 × 1280 · 4:5</text><text x="402" y="442">full opaque background</text><text x="675" y="410">512 × 512 · 1:1</text><text x="675" y="442">separate enemy image</text><text x="1000" y="410">1672 × 941 · ≈ 16:9</text><text x="1000" y="442">full scene background</text><text x="610" y="510" font-size="17">Both character files need complete backgrounds. The game does not paint them.</text></g>
